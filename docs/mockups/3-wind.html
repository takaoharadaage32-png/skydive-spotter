<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Skydive Spotter 風</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#15191E}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 1060px; box-sizing: border-box; background: #F3F4F1; color: #15191E; font-family: 'IBM Plex Sans JP', system-ui, sans-serif; display: flex; flex-direction: column">
<header style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; font-weight: 500; letter-spacing: 0.08em; color: #5A626B">SKYDIVE SPOTTER · WINDS ALOFT</div>
<h1 style="margin: 0; font-size: 24px; font-weight: 700">上空の風</h1>
</header>
<main style="flex: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 14px">

<section style="background: #FFFFFF; border: 1px solid #D9DCD6; border-radius: 16px; padding: 12px 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #5A626B">モデル</span><span style="font-size: 14px; font-weight: 700">JMA MSM</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #5A626B">予報時刻</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600">10/18 10:00</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #5A626B">取得</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600">9:12</span></div>
</section>

<section style="background: #FFFFFF; border: 1px solid #D9DCD6; border-radius: 16px; padding: 4px 16px 10px">
<div style="display: grid; grid-template-columns: 64px 28px 48px 48px minmax(0, 1fr); gap: 8px; align-items: center; min-height: 36px; font-size: 11px; color: #5A626B">
<span>高度 ft</span><span></span><span>風向</span><span>kt</span><span>風速</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0 4px; border-top: 1px solid #D9DCD6">
<span style="font-size: 12px; font-weight: 700">フリーフォール区間</span>
<span style="font-size: 11px; color: #5A626B">Level 1 平均 276°M 23 kt</span>
</div>
<sc-for list="{{ff}}" as="r" hint-placeholder-count="11">
<div style="display: grid; grid-template-columns: 64px 28px 48px 48px minmax(0, 1fr); gap: 8px; align-items: center; min-height: 34px; border-top: 1px solid #F0F1EE">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600">{{r.alt}}</span>
<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" style="transform: rotate({{r.rot}}deg)"><path d="M11 18V4M6 9L11 4L16 9" fill="none" stroke="#15191E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px">{{r.dir}}°M</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600">{{r.spd}}</span>
<div style="height: 8px; border-radius: 4px; background: #ECEEE9"><div style="height: 8px; border-radius: 4px; background: {{accent}}; width: {{r.bar}}"></div></div>
</div>
</sc-for>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0 4px; border-top: 1px solid #D9DCD6">
<span style="font-size: 12px; font-weight: 700">キャノピー区間</span>
<span style="font-size: 11px; color: #5A626B">Level 1 平均 265°M 9 kt</span>
</div>
<sc-for list="{{cn}}" as="r" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 64px 28px 48px 48px minmax(0, 1fr); gap: 8px; align-items: center; min-height: 34px; border-top: 1px solid #F0F1EE">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600">{{r.alt}}</span>
<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" style="transform: rotate({{r.rot}}deg)"><path d="M11 18V4M6 9L11 4L16 9" fill="none" stroke="#15191E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px">{{r.dir}}°M</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600">{{r.spd}}</span>
<div style="height: 8px; border-radius: 4px; background: #ECEEE9"><div style="height: 8px; border-radius: 4px; background: #1D4ED8; width: {{r.bar}}"></div></div>
</div>
</sc-for>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="min-height: 48px; border-radius: 12px; border: 1px solid #15191E; background: #FFFFFF; color: #15191E; font: inherit; font-size: 14px; font-weight: 500">手入力で上書き</button>
<button style="min-height: 48px; border-radius: 12px; border: 1px solid #15191E; background: #FFFFFF; color: #15191E; font: inherit; font-size: 14px; font-weight: 500">風を再取得</button>
</div>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5A626B">矢印は風に流される向き。風向は吹いてくる方向（磁方位・偏角 8°W。予報の真方位から変換）。Weather data by Open-Meteo.com</p>
</main>
<nav aria-label="タブ" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #D9DCD6; background: #FFFFFF; padding: 6px 8px 22px; margin-top: 14px">
<a href="Main.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: #5A626B; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13" fill="none" stroke="#5A626B" stroke-width="1.75" stroke-linecap="round"></path></svg>入力</a>
<a href="Result.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: #5A626B; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="#5A626B" stroke-width="1.75"></circle><circle cx="12" cy="12" r="2.5" fill="#5A626B"></circle></svg>結果</a>
<a href="Wind.dc.html" aria-current="page" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: #15191E; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h12a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3" fill="none" stroke="#15191E" stroke-width="2" stroke-linecap="round"></path></svg>風</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1D4ED8","#15803D","#15191E"]},"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
renderVals() {
const mk = (alt, dir, spd) => ({ alt: alt.toLocaleString('en-US'), dir: String((dir + 8) % 360).padStart(3, '0'), spd: spd, rot: (dir + 180) % 360, bar: Math.round(spd / 35 * 100) + '%' });
const ff = [[13000,270,32],[12000,270,30],[11000,272,28],[10000,272,26],[9000,270,24],[8000,270,22],[7000,270,20],[6000,268,18],[5000,265,16],[4000,265,14],[3000,262,12]].map(a => mk(a[0], a[1], a[2]));
const cn = [[2000,260,10],[1000,255,8],[500,252,7],[0,250,6]].map(a => mk(a[0], a[1], a[2]));
return { accent: this.props.accent ?? '#C2410C', ff: ff, cn: cn };
}
}
</script>
</body>
</html>
